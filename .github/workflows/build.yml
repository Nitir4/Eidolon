name: Build, test and package

on:
  push:
    branches: [main, future-scope]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            qt_archives: qtbase icu qtwayland qtsvg
          - os: macos-latest
            qt_arch: clang_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF test reader
        run: python -m pip install --disable-pip-version-check pypdf==6.20.0
      - name: Prepare MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.13.0 --yes --no-progress
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives || 'qtbase' }}
          cache: true
          setup-python: false
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake --preset ci '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          else
            cmake --preset ci
          fi
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Run all tests
        env:
          TORA_UI_CAPTURES: ${{ github.workspace }}/build/ci/ui-captures
        run: ctest --preset ci --output-junit "${{ github.workspace }}/build/ci/test-results.xml"
      - name: Install Linux desktop check servers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends weston xvfb xauth
      - name: Package and verify deployed startup
        run: python tools/package_desktop.py --build-dir build/ci --output-dir dist
      - name: Verify Linux desktop protocol startup
        if: runner.os == 'Linux'
        run: |
          python tools/verify_linux_desktop.py dist/TORA-Clone-0.1.0-linux-x86_64.AppImage --output build/ci/desktop-runtime
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: TORA-Clone-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-${{ matrix.os }}
          path: |
            build/ci/test-results.xml
            build/ci/tests/all-slack-comparison.tsv
            build/ci/tests/m-method-comparison.tsv
            build/ci/tests/two-phase-comparison.tsv
            build/ci/tests/bounded-comparison.tsv
            build/ci/tests/dual-comparison.tsv
            build/ci/tests/graphical-comparison.tsv
            build/ci/tests/final-comparison.tsv
            build/ci/tests/sensitivity-comparison.tsv
            build/ci/tests/transportation-northwest-comparison.tsv
            build/ci/tests/transportation-leastcost-comparison.tsv
            build/ci/tests/transportation-vogel-comparison.tsv
            build/ci/tests/desktop-transportation-scale-*.xml
            build/ci/tests/desktop-input-scale-*.xml
            build/ci/tests/desktop-simplex-scale-*.xml
            build/ci/tests/desktop-m-method-scale-*.xml
            build/ci/tests/desktop-two-phase-scale-*.xml
            build/ci/tests/desktop-bounded-scale-*.xml
            build/ci/tests/desktop-dual-scale-*.xml
            build/ci/tests/desktop-graphical-scale-*.xml
            build/ci/tests/desktop-final-scale-*.xml
            build/ci/tests/desktop-sensitivity-scale-*.xml
            build/ci/tests/desktop-display-changes.xml
            build/ci/tests/desktop-printing.xml
            build/ci/tests/printing-pdfs/
            build/ci/ui-captures/
            build/ci/desktop-runtime/
          if-no-files-found: warn
