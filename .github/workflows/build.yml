name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
          - os: macos-latest
            qt_arch: clang_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: ${{ matrix.qt_arch }}
          archives: qtbase
          cache: true
          setup-python: false
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake --preset ci '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          else
            cmake --preset ci
          fi
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Run all tests
        run: ctest --preset ci --output-junit build/ci/test-results.xml
      - name: Package and verify deployed startup
        run: python tools/package_desktop.py --build-dir build/ci --output-dir dist
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: TORA-Clone-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-${{ matrix.os }}
          path: build/ci/test-results.xml
          if-no-files-found: warn
