name: Build, test and package

on:
  push:
    branches: [main, future-scope]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Native platforms to validate
        type: choice
        options: [all, windows-and-macos]
        default: all
      playtest:
        description: Build friends' ZIPs and run their integrity/startup scripts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows-and-macos' && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest","ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF test reader
        run: python -m pip install --disable-pip-version-check pypdf==6.20.0
      - name: Prepare MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.13.0 --yes --no-progress
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
          archives: ${{ runner.os == 'Linux' && 'qtbase icu qtwayland qtsvg' || 'qtbase' }}
          cache: true
          setup-python: false
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake --preset ci '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          else
            cmake --preset ci
          fi
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Run all tests
        env:
          TORA_UI_CAPTURES: ${{ github.workspace }}/build/ci/ui-captures
        run: ctest --preset ci --output-junit "${{ github.workspace }}/build/ci/test-results.xml"
      - name: Install Linux desktop check servers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends weston xvfb xauth
      - name: Package and verify deployed startup
        run: python tools/package_desktop.py --build-dir build/ci --output-dir dist
      - name: Verify Linux desktop protocol startup
        if: runner.os == 'Linux'
        run: |
          python tools/verify_linux_desktop.py dist/Eidolon-0.1.0-linux-x86_64.AppImage --output build/ci/desktop-runtime
      - name: Create friends' playtest bundle
        if: inputs.playtest && runner.os != 'Linux'
        run: python tools/package_playtest.py --native-dir dist --output-dir dist/playtest
      - name: Verify Windows friends' checks
        if: inputs.playtest && runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/playtest/windows.zip -DestinationPath build/friends
          & build/friends/scripts/run-checks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify macOS friends' checks
        if: inputs.playtest && runner.os == 'macOS'
        run: |
          ditto -x -k dist/playtest/macos.zip build/friends
          sh build/friends/scripts/run-checks.sh
      - name: Upload friends' checks
        if: always() && inputs.playtest && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Friends-checks-${{ matrix.os }}
          path: build/friends/results/
          if-no-files-found: warn
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eidolon-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-${{ matrix.os }}
          path: |
            build/ci/test-results.xml
            build/ci/tests/all-slack-comparison.tsv
            build/ci/tests/m-method-comparison.tsv
            build/ci/tests/two-phase-comparison.tsv
            build/ci/tests/bounded-comparison.tsv
            build/ci/tests/dual-comparison.tsv
            build/ci/tests/graphical-comparison.tsv
            build/ci/tests/final-comparison.tsv
            build/ci/tests/sensitivity-comparison.tsv
            build/ci/tests/transportation-northwest-comparison.tsv
            build/ci/tests/transportation-leastcost-comparison.tsv
            build/ci/tests/transportation-vogel-comparison.tsv
            build/ci/tests/transportation-editgrid-comparison.tsv
            build/ci/tests/transportation-multipliers-comparison.tsv
            build/ci/tests/transportation-final-comparison.tsv
            build/ci/tests/desktop-transportation-scale-*.xml
            build/ci/tests/desktop-transportation-final-scale-*.xml
            build/ci/tests/desktop-transportation-input-scale-*.xml
            build/ci/tests/desktop-input-scale-*.xml
            build/ci/tests/desktop-simplex-scale-*.xml
            build/ci/tests/desktop-m-method-scale-*.xml
            build/ci/tests/desktop-two-phase-scale-*.xml
            build/ci/tests/desktop-bounded-scale-*.xml
            build/ci/tests/desktop-dual-scale-*.xml
            build/ci/tests/desktop-graphical-scale-*.xml
            build/ci/tests/desktop-final-scale-*.xml
            build/ci/tests/desktop-sensitivity-scale-*.xml
            build/ci/tests/desktop-display-changes.xml
            build/ci/tests/desktop-printing.xml
            build/ci/tests/printing-pdfs/
            build/ci/tests/desktop-transportation-printing.xml
            build/ci/tests/transportation-printing-pdfs/
            build/ci/ui-captures/
            build/ci/desktop-runtime/
          if-no-files-found: warn
